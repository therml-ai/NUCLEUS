# Rolls a trained model out from the history frames of every test case of split_dir
# and writes each rollout as a BubbleML file at the case's path within the split.
checkpoint_path: ???
# a directory made by boiling-data's scripts/split_dataset.py
split_dir: ???
# defaults to a rollouts directory next to the checkpoint
output_dir:

start_frame: 200
history_timesteps: 8
# frames predicted per model call, at most history_timesteps
frames_per_step: 8
trajectory_steps: 300

defaults:
  - _self_
  - data_cfg: flashx
