checkpoint_path: # path to resume training
commit_sha: # Can be used to log git commit sha for training run
profile: # bool, set True to do a short run pytorch profiler

# Root path for dataset files, referenced as ${data_dir} in the data_cfg paths.
# Mandatory and unset by default so it must be set by users in this file or 
# provided on the CLI, e.g. data_dir=/path/to/BubbleML_2
data_dir: ???

# directory to write logs, model checkpoints, and profiles
log_dir: ???

# which pytorch Dataset class to use.
# Options are implemented in src/nucleus/data/
# 1. forecast
# 2. in_mem_forecast
# "in_mem" datasets try to load the whole dataset into CPU memory
# to make training a little faster. These of course only works when the dataset
# is small enough to fit into CPU memory...!
pydataset: ??? 


seed: 42

nodes: 1
devices: 1

max_epochs:
max_steps: 20000
val_check_interval:
check_val_every_n_epoch: 1
batch_size: 16
accumulate_grad_batches: 1

history_time_window: 8
future_time_window: 8
time_step: 1
start_time: 200

defaults:
  - _self_
  - data_cfg: poolboiling64
  - model_cfg: nucleus2/nucleus2_experiment
  - optim_cfg: adamw
  - scheduler_cfg: cosine_warmup
  - normalizer_cfg: standard
